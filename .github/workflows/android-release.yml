name: Build Android APK and GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0-preview.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check release prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node scripts/check-release.mjs
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Use a new version tag.'
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build signed standalone APK on Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/build-android-release.mjs
      - name: Preserve APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusBubble-${{ env.RELEASE_TAG }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish testing prerelease with download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --verify-tag --prerelease --title "FocusBubble $RELEASE_TAG" \
            --notes-file docs/ANDROID_RELEASE_NOTES.md
